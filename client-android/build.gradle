plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'app.docreader'
    compileSdk 36
    defaultConfig {
        applicationId 'app.docreader'
        minSdk 26
        targetSdk 36
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { inputs.file('src/main/AndroidManifest.xml') }
        unitTests.all {
            if (file('.local-tool-app/robolectric').listFiles()?.any { it.name.endsWith('.jar') }) {
                systemProperty 'robolectric.offline', 'true'
                systemProperty 'robolectric.dependency.dir', file('.local-tool-app/robolectric').absolutePath
            } else {
                systemProperty 'maven.repo.local', file('.local-tool-app/maven').absolutePath
                systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            }
        }
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-android:2.10.0'
    implementation 'androidx.room:room-runtime-android:2.8.4'
    implementation 'androidx.datastore:datastore-preferences-android:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    ksp 'androidx.room:room-compiler:2.8.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
