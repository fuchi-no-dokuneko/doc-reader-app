name: Android runtime gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  android9:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - name: Build app and instrumentation APKs
        run: |
          ./install-local-build.sh
          ./gradlew :client-android:assembleDebug :client-android:assembleDebugAndroidTest
      - name: Run Android 9 picker, intent, parser and migration checks
        run: ./client-android/test-native.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: doc-reader-native-android9
          path: fan-out/native/
          retention-days: 14
